input {
  # Приём логов от Filebeat
  beats {
    port => 5044
  }
  
  # Приём JSON-сообщений по TCP (согласно заданию)
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  # Опционально: добавление тега для удобства фильтрации
  if [container] {
    mutate {
      add_tag => ["docker_container_log"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch-hot:9200"]
    index => "logstash-%{+YYYY.MM.dd}"
  }
  
  # Для отладки можно раскомментировать строку ниже:
  # stdout { codec => rubydebug }
}
