filebeat.inputs:
- type: container
  paths:
    - '/var/lib/docker/containers/*/*.log'
  stream: all
  json.keys_under_root: true
  json.add_error_key: true
  json.message_key: log

processors:
- add_docker_metadata:
    host: "unix:///var/run/docker.sock"

output.logstash:
  hosts: ["logstash:5044"]